<!doctype html>

<html>

<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial scale=1.0">
</head>

<body>
    <div>
        <h1>Regiter Page</h1>
        <form>
            <fieldset>
                <div>
                    <label> First name</label>
                    <input type="text" placeholder=" Enter name" name="firstname" required>
                </div>
                <div>
                    <label> Last name</label>
                    <input type="text" placeholder=" Enter name" name="lastname"required>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" placeholder=" Enter Email" name="email" required>
                </div>
                <div>
                    <label>Passoword</label>
                    <input type="password" placeholder="Enter Passoword" name="Passoword" required>
                </div>
                <div>
                    <label> Confirm Passoword</label>
                    <input type="password" placeholder="re-enter passoword" name="confirmpassoword" required>
                </div>
            </fieldset>

            <button type="submit">Register </button>
            <span>
                <p>Already have an account?</p>
                <a href="login.html">Login</a>
            </span>
        </form>

    </div>

</body>

</html>
