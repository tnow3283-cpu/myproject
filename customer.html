<!doctype html>
<html>

<head>
    <title>Customer Support</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial scale=1.0">
</head>

<body>
    <div>
        <h1> Customer Support</h1>
        <fieldset>
            <div>
                <label for="firstame">Full name</label>
                <input type="text" placeholder=" Enter name" id="firstame" name="name" required>
            </div>
            <div>
                <label> Email</label>
                <input type="email" placeholder=" Enter Email" name="email" required>
            </div>
            <div>
                <label> Topic Message</label>
                <input type="text" placeholder="Enter Topic" id="message" required>
            </div>
            <div>
                <label for="Message">Message</label>
                <textarea name="message" id="message" rows="10px" cols="80px"></textarea>
            </div>

        </fieldset>
        <button type="submit">Submit</button>

    </div>

</body>

</html>
